name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build MockLocation APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore or cache release keystore
        uses: actions/cache@v4
        with:
          path: keystore
          key: android-signing-keystore-v1

      - name: Generate release keystore if missing
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -storepass mocklocation123 \
              -keypass mocklocation123 \
              -alias mocklocation \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MockLocation, OU=Mobile, O=Personal, L=Beijing, S=Beijing, C=CN"
          fi

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests & build release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          SIGNING_STORE_PASSWORD: mocklocation123
          SIGNING_KEY_ALIAS: mocklocation
          SIGNING_KEY_PASSWORD: mocklocation123
        run: gradle testDebugUnitTest assembleRelease --no-daemon

      - name: Prepare APK outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MockLocation-latest.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/MockLocation-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MockLocation-APK
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 虚拟定位助手 v1.0.${{ github.run_number }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ### 📱 手机直接安装说明
            1. 点击下方 **`MockLocation-latest.apk`** 下载安装包（无需解压）。
            2. 在安卓手机上安装后，打开 **系统设置 → 关于手机 → 连续点击“版本号”7次** 开启开发者模式。
            3. 进入 **系统设置 → 开发者选项 → 选择模拟位置信息应用**，选中 **虚拟定位助手**。
            4. 打开 App，在地图上选点（或搜索地点/粘贴坐标），点击 **开始虚拟定位**，再打开高德/百度/腾讯/Google 地图即可生效。
